spring:
  application:
    name: drones
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3306/drones?createDatabaseIfNotExist=true
    username: root
    password: toor
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  servlet:
    multipart:
      max-request-size: -1
      max-file-size: -1
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
server:
  port: 8082
logging:
  level:
    root: INFO
  file:
    name: /tmp/reaktor_printersServer.log
    max-size: 1MB
    max-history: 10
    total-size-cap: 10MB

